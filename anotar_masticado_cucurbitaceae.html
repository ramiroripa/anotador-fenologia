.side{background:var(--panel);border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}

.q{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}

.opt:hover{border-color:var(--accent)}.opt.on{background:var(--accent);color:#08222b;border-color:transparent}
.notas{width:100%;background:var(--p2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px;font-size:13px}
.nav{display:flex;gap:8px;margin-top:auto}.nav button{flex:1;background:var(--p2);border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:8px;font-size:13px}
.nav button.primary{background:var(--accent);color:#08222b;border-color:transparent;font-weight:600}
.pos{color:var(--muted);font-size:12px;text-align:center}
