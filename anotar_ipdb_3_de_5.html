<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Fenofases 3/5</title>
<style>
  :root{--bg:#111418;--panel:#1a1f26;--line:#2b323c;--txt:#e8ecf1;--dim:#9aa5b1;
    --flower:#55A868;--fruit:#4C72B0;--bud:#DD8452;--vegetative:#8C8C8C;--senescent:#B07AA1;
    --sb:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #prog{flex:1 1 auto;height:6px;background:#0d1014;border-radius:3px;overflow:hidden}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#4C72B0,#55A868)}
  #cnt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
  #rate{font-size:11px;color:var(--dim)}
  .ico{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:13px}
  #stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;touch-action:none}
  #img{max-width:100%;max-height:100%;object-fit:contain;display:block;transform-origin:0 0}
  #meta{position:absolute;left:0;right:0;top:0;padding:6px 10px;font-size:12px;color:#dfe6ee;
    background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));pointer-events:none}
  #meta i{color:#b9c6d4;font-style:normal}
  #zl{position:absolute;right:8px;bottom:8px;font-size:11px;color:#cfd8e3;background:rgba(0,0,0,.55);
    padding:3px 7px;border-radius:8px;display:none}
  #spin{position:absolute;width:26px;height:26px;border:3px solid #2b323c;border-top-color:#8fb3e0;border-radius:50%;
    animation:sp .8s linear infinite;display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  #fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:#0d1014;padding:24px;text-align:center}
  #chips{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 8px 0}
  .chip{appearance:none;border:2px solid var(--line);background:#161b22;color:var(--txt);border-radius:12px;
    padding:14px 4px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
  .chip small{font-size:10px;font-weight:400;color:var(--dim)}
  .chip.on{color:#0b0d10}.chip.on small{color:rgba(0,0,0,.6)}
  .chip[data-c=flower].on{background:var(--flower);border-color:var(--flower)}
  .chip[data-c=fruit].on{background:var(--fruit);border-color:var(--fruit);color:#fff}
  .chip[data-c=fruit].on small{color:rgba(255,255,255,.75)}
  .chip[data-c=bud].on{background:var(--bud);border-color:var(--bud)}
  .chip[data-c=vegetative].on{background:var(--vegetative);border-color:var(--vegetative)}
  .chip[data-c=senescent].on{background:var(--senescent);border-color:var(--senescent)}
  #acts{flex:0 0 auto;display:grid;grid-template-columns:52px 52px 1fr 52px;gap:6px;padding:8px 8px calc(8px + var(--sb))}
  .btn{appearance:none;border:1px solid var(--line);background:#161b22;color:var(--txt);border-radius:12px;
    padding:15px 0;font-size:15px;font-weight:600}
  #noev.on{background:#6b2f2f;border-color:#6b2f2f;color:#fff}
  #next{background:#1f6f43;border-color:#1f6f43;color:#fff;font-size:17px}
  #next.vacio{background:#2b323c;border-color:#2b323c;color:var(--dim)}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--sb));background:#0b0d10;
    border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:20;max-width:86%;text-align:center}
  #toast.show{opacity:1}
  #sal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;padding:20px;z-index:30}
  #sal textarea{width:100%;height:42vh;background:#0d1014;color:var(--txt);border:1px solid var(--line);
    border-radius:10px;font-size:11px;user-select:text}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ico" id="atras">&#8592;</button>
    <div id="prog"><div id="bar"></div></div>
    <div id="cnt">0/0</div><div id="rate"></div>
    <button class="ico" id="menu">&#8942;</button>
  </div>
  <div id="stage">
    <div id="spin"></div><img id="img" alt=""><div id="meta"></div><div id="zl"></div>
    <div id="fin"><h2 style="margin:0">Listo</h2><p id="fintxt" style="color:#9aa5b1"></p>
      <button class="btn" id="fdl">Descargar CSV</button>
      <button class="btn" id="fcopy">Copiar al portapapeles</button></div>
  </div>
  <div id="chips"></div>
  <div id="acts">
    <button class="btn" id="skip" title="dudosa, volver después">?</button>
    <button class="btn" id="noev" title="no evaluable">&#10005;</button>
    <button class="btn" id="next">Siguiente</button>
    <button class="btn" id="nota">&#9998;</button>
  </div>
</div>
<div id="toast"></div>
<div id="sal"><p style="color:#9aa5b1;margin:0">Copiá todo y pegalo en un archivo .csv</p>
  <textarea id="saltxt" readonly></textarea><button class="btn" id="salclose">Cerrar</button></div>

var A = {}, idx = 0, nDone = 0, nDone0 = 0, t0 = null, verDatos = false, avisoExport = 0;
var LS = "anot_" + KIT;
var $ = function(s){ return document.querySelector(s); };
var tT;
function toast(m){ var t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove("show"); }, 2200); }

/* ---- fotos: pedir la version de 1024 px y caer a original si no existe ---- */
function urlChica(u){ return u.replace(/\/original\./, "/large."); }

/* ---- estado guardado ---- */
try{
  var sv = JSON.parse(localStorage.getItem(LS) || "{}");
  if(sv && sv.A){ A = sv.A; idx = sv.idx || 0; verDatos = !!sv.verDatos; }
}catch(e){ A = {}; }
function contar(){ var n = 0; for(var k in A){ if(A[k] && A[k]._v) n++; } return n; }
nDone = contar(); nDone0 = nDone;      /* solo confirmadas, no las tocadas sin confirmar */

function save(){
  try{ localStorage.setItem(LS, JSON.stringify({A:A, idx:idx, kit:KIT, verDatos:verDatos,
       t:new Date().toISOString()})); }
  catch(e){ toast("Memoria llena: descargá el CSV"); }
}
function rec(){ var id = D[idx].i; if(!A[id]) A[id] = {}; return A[id]; }
function get(c){ var r = A[D[idx].i]; return !!(r && r[c]); }

var chips = $("#chips");
CLS.forEach(function(c){
  var b = document.createElement("button");
  b.className = "chip"; b.setAttribute("data-c", c);
  b.innerHTML = NICE[c] + "<small>" + HINT[c] + "</small>";
  b.addEventListener("click", function(){
    var r = rec(); r[c] = r[c] ? 0 : 1;
    if(r[c]) r.ne = 0;
    paint(); if(navigator.vibrate) navigator.vibrate(8);
  });
  chips.appendChild(b);
});

function paint(){
  CLS.forEach(function(c){
    var el = document.querySelector('.chip[data-c="' + c + '"]');
    if(el){ if(get(c)) el.classList.add("on"); else el.classList.remove("on"); }
  });
  var r = A[D[idx].i] || {};
  if(r.ne) $("#noev").classList.add("on"); else $("#noev").classList.remove("on");
  var any = CLS.some(get) || !!r.ne;
  if(any){ $("#next").classList.remove("vacio"); $("#next").textContent = "Siguiente"; }
  else { $("#next").classList.add("vacio"); $("#next").textContent = "Ninguna"; }
}
function render(){
  if(idx >= D.length){ fin(); return; }
  $("#fin").style.display = "none"; $("#img").style.display = "block";
  zoomReset();
  var r = D[idx], im = $("#img");
  $("#spin").style.display = "block";
  im.onload = function(){ $("#spin").style.display = "none"; };
  im.onerror = function(){ if(im.src !== r.u){ im.src = r.u; } else { $("#spin").style.display = "none"; toast("No cargó la foto"); } };
  im.src = urlChica(r.u);
  $("#meta").innerHTML = verDatos
    ? "<b>" + (r.s || "sin especie") + "</b> <i>" + (r.f || "") + "</i> <i>mes " + (r.d || "?") + "</i>"
    : "";
  $("#cnt").textContent = (idx + 1) + "/" + D.length;
  $("#bar").style.width = (100 * nDone / D.length).toFixed(1) + "%";
  var hechasHoy = nDone - nDone0;
  if(t0 && hechasHoy > 2){
    var pm = hechasHoy / ((Date.now() - t0) / 60000);
    var falta = (D.length - nDone) / Math.max(pm, 0.1);
    $("#rate").textContent = pm.toFixed(0) + "/min · " + (falta < 60 ? Math.round(falta) + " min" : (falta / 60).toFixed(1) + " h");
  }
  paint();
  for(var k = 1; k <= 2; k++){ if(D[idx + k]){ var p = new Image(); p.src = urlChica(D[idx + k].u); } }
}
function commit(confirmarVacia){
  var r = rec();
  var any = CLS.some(function(c){ return r[c]; }) || r.ne;
  if(!any && confirmarVacia !== true){
    toast('Marcá una fenofase, o tocá "Ninguna" para decir que no hay ninguna visible');
    return;
  }
  CLS.forEach(function(c){ if(!r[c]) r[c] = 0; });
  if(!r.ne) r.ne = 0;
  r.sk = 0;
  if(!r._v){ r._v = 1; nDone++; }
  if(!t0) t0 = Date.now();
  save();
  if(nDone - avisoExport >= 250){ avisoExport = nDone;
    toast("Van " + nDone + ". Conviene descargar el CSV por si el teléfono borra los datos."); }
  idx++; render();
}
function fin(){
  $("#img").style.display = "none"; $("#spin").style.display = "none";
  $("#fin").style.display = "flex";
  var sk = 0; for(var k in A){ if(A[k] && A[k].sk) sk++; }
  $("#fintxt").textContent = nDone + " de " + D.length + " anotadas" + (sk ? ", " + sk + " marcadas como dudosas" : "") + ".";
}
function csv(){
  var h = ["gbif_id","species","family","month","doble_anotacion"].concat(CLS.map(function(c){ return "val_" + c; }));
  h = h.concat(["no_evaluable","dudosa","annotator_notes","_validated","kit"]);
  var out = [h.join(",")];
  D.forEach(function(r){
    var a = A[r.i] || {};
    var row = [r.i, '"' + String(r.s || "").replace(/"/g, '""') + '"', r.f || "", r.d || "", r.v ? 1 : 0];
    CLS.forEach(function(c){ row.push(a[c] ? 1 : 0); });
    row.push(a.ne ? 1 : 0);
    row.push(a.sk ? 1 : 0);
    row.push('"' + String(a.n || "").replace(/"/g, '""') + '"');
    row.push(a._v ? 1 : "");
    row.push(KIT);
    out.push(row.join(","));
  });
  return out.join("\n");
}
function bajar(){
  var t = csv();
  try{
    var b = new Blob([t], {type:"text/csv"}), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = KIT + "_anotado.csv"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1000);
    toast("CSV descargado");
  }catch(e){ copiar(); }
}
function copiar(){
  var t = csv();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("Copiado al portapapeles"); },
      function(){ $("#saltxt").value = t; $("#sal").style.display = "flex"; });
  } else { $("#saltxt").value = t; $("#sal").style.display = "flex"; }
}

/* ---- zoom y paneo: pinch con dos dedos, doble toque, arrastre cuando esta ampliada ---- */
var z = 1, tx = 0, ty = 0, pinch0 = 0, z0 = 1, pan = null, lastTap = 0;
function aplicar(){
  var im = $("#img");
  im.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + z + ")";
  var zl = $("#zl");
  if(z > 1.02){ zl.style.display = "block"; zl.textContent = z.toFixed(1) + "x · dos toques para salir"; }
  else zl.style.display = "none";
}
function zoomReset(){ z = 1; tx = 0; ty = 0; aplicar(); }
function dist(t){ var a = t[0], b = t[1];
  return Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2)); }
var stage = $("#stage"), sx = 0, sy = 0, st = 0;
stage.addEventListener("touchstart", function(e){
  if(e.touches.length === 2){ pinch0 = dist(e.touches); z0 = z; pan = null; }
  else if(e.touches.length === 1){
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
    pan = (z > 1.02) ? {x:t.clientX, y:t.clientY, tx:tx, ty:ty} : null;
  }
}, {passive:true});
stage.addEventListener("touchmove", function(e){
  if(e.touches.length === 2 && pinch0){
    z = Math.min(6, Math.max(1, z0 * dist(e.touches) / pinch0)); aplicar();
    if(e.cancelable) e.preventDefault();
  } else if(pan && e.touches.length === 1){
    tx = pan.tx + (e.touches[0].clientX - pan.x);
    ty = pan.ty + (e.touches[0].clientY - pan.y); aplicar();
    if(e.cancelable) e.preventDefault();
  }
}, {passive:false});
stage.addEventListener("touchend", function(e){
  if(e.touches.length === 0) pinch0 = 0;
  if(pan){ pan = null; return; }
  if(z > 1.02) return;                                  /* ampliada: no navegar */
  var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if(Date.now() - st < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6){
    if(dx < 0){
      var r = A[D[idx].i] || {};
      var any = CLS.some(function(c){ return r[c]; }) || r.ne;
      if(any) commit(); else toast("Nada marcado: usá el botón para confirmar que no hay fenofase");
    } else if(idx > 0){ idx--; render(); }
    return;
  }
  var now = Date.now();
  if(now - lastTap < 300){ if(z > 1.02) zoomReset(); else { z = 2.5; aplicar(); } }
  lastTap = now;
}, {passive:true});

$("#next").addEventListener("click", function(){
  var r = A[D[idx].i] || {};
  var any = CLS.some(function(c){ return r[c]; }) || r.ne;
  commit(any ? undefined : true);        /* el boton dice "Ninguna": es explicito */
});
$("#atras").addEventListener("click", function(){ if(idx > 0){ idx--; render(); } });
$("#skip").addEventListener("click", function(){
  var r = rec(); r.sk = 1; save(); idx++; render(); toast("Marcada como dudosa");
});
$("#noev").addEventListener("click", function(){
  var r = rec(); r.ne = r.ne ? 0 : 1;
  if(r.ne) CLS.forEach(function(c){ r[c] = 0; });
  paint();
});
$("#nota").addEventListener("click", function(){
  var r = rec(); var v = prompt("Nota:", r.n || "");
  if(v !== null){ r.n = v; save(); toast("Nota guardada"); }
});
$("#menu").addEventListener("click", function(){
  var o = prompt("1 = descargar CSV\n2 = copiar al portapapeles\n3 = ir a una foto\n4 = " +
                 (verDatos ? "ocultar" : "mostrar") + " especie y fecha\n5 = borrar lo guardado", "1");
  if(o === "1") bajar();
  else if(o === "2") copiar();
  else if(o === "3"){ var n = parseInt(prompt("Número de foto (1-" + D.length + ")", "1"), 10);
    if(n >= 1 && n <= D.length){ idx = n - 1; render(); } }
  else if(o === "4"){ verDatos = !verDatos; save(); render();
    toast(verDatos ? "Ojo: ver la fecha puede sesgar la etiqueta" : "Datos ocultos"); }
  else if(o === "5"){ if(confirm("¿Borrar las anotaciones guardadas en este teléfono?")){
    localStorage.removeItem(LS); A = {}; nDone = 0; nDone0 = 0; idx = 0; render(); toast("Borrado"); } }
});
$("#fdl").addEventListener("click", bajar);
$("#fcopy").addEventListener("click", copiar);
$("#salclose").addEventListener("click", function(){ $("#sal").style.display = "none"; });
document.addEventListener("keydown", function(e){
  var n = parseInt(e.key, 10);
  if(n >= 1 && n <= CLS.length){ var r = rec(), c = CLS[n-1]; r[c] = r[c] ? 0 : 1; if(r[c]) r.ne = 0; paint(); }
  else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); $("#next").click(); }
  else if(e.key === "ArrowLeft"){ if(idx > 0){ idx--; render(); } }
  else if(e.key === "ArrowRight"){ $("#next").click(); }
  else if(e.key === "x" || e.key === "X") $("#noev").click();
  else if(e.key === "?") $("#skip").click();
});
window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", function(){ if(document.hidden) save(); });
if(nDone > 0) toast("Recuperé " + nDone + " anotaciones confirmadas");
render();
})();
</script>
</body>
</html>
