window.DL=function(){var o=[COLS.join(",")];R.forEach(function(r){o.push(COLS.map(function(k){var v=(r[k]==null?"":""+r[k]);return /[",\n]/.test(v)?("\""+v.replace(/"/g,"\"\"")+"\""):v}).join(","))});var b=new Blob([o.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=FN;a.click()};
document.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT")return;if(e.key==="Enter"){CONFIRM();e.preventDefault()}else if(e.key==="ArrowRight"){NAV(1);e.preventDefault()}else if(e.key==="ArrowLeft"){NAV(-1);e.preventDefault()}});
render();})();
</script></body></html>
